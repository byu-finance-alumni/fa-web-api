[project]
name = "fa-web-api"
version = "0.1.0"
description = "Backend API and database layer for the BYU Finance Alumni Database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
]

# Tell Vercel which ASGI app to serve (avoids entrypoint ambiguity).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Seed/fixture data is most readable as one record per line.
"scripts/seed_mock_data.py" = ["E501"]
