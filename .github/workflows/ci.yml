name: CI

# Gates code entering the long-lived branches. Mirrors fa-web-app/ci.yml:
#   - PR into dev:  BASE checks must pass (lint, import smoke, tests)
#   - PR into prod: BASE checks PLUS the prod-only tier (dependency audit)
#
# "Will it break on Vercel?" is verified by Vercel's own GitHub deployment
# check (each branch deploys to its own Vercel project), which is required
# separately via branch protection — not duplicated here.
#
# `dev` and `prod` have SEPARATE Supabase databases (dev = the original project
# with mock data; prod = a dedicated project, stood up 2026-07-09). Each branch
# migrates its own database automatically after checks pass: `migrate-dev` on a
# push to dev, `migrate` on a push to prod. The connection string is the
# Environment secret MIGRATIONS_DATABASE_URL, set on BOTH Environments (see
# database/migrations/README.md).
#
# ⚠️ There is NO approval gate on either job, and none may be added. One existed
# and caused a prod outage: the approval held the MIGRATION while Vercel deployed
# the CODE independently, so new code ran against the old schema.
#
# ⚠️ These jobs trail the Vercel deploy by minutes. Sequence the DEPLOY instead:
# for a schema-dependent change, push a migration-only commit to prod first, let
# it apply, then promote the code. Old code + new schema is safe; the reverse is
# not.
on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # matches Vercel's default runtime

jobs:
  # ---------------------------------------------------------------------------
  # BASE TIER — required for BOTH dev and prod.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import smoke check (build-equivalent)
        # No bundler for a Python serverless app; verify the ASGI app imports
        # cleanly, which is what Vercel does at cold start.
        run: python -c "import app.main; print('app.main imported OK')"
      - name: Run tests
        run: pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Scan for committed secrets
        run: gitleaks detect --redact --no-banner --verbose

  deploy-deps:
    name: Deploy deps (pyproject parity)
    runs-on: ubuntu-latest
    # Vercel's Python builder installs ONLY pyproject.toml [project.dependencies]
    # (not requirements*.txt). Install exactly those into a clean env and import the
    # ASGI app, so a runtime dependency that's missing from pyproject.toml fails CI
    # here instead of crashing the deployed function ("could not import app/main").
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install only pyproject.toml runtime deps
        run: |
          python -m pip install --upgrade pip
          python -c "import tomllib,subprocess,sys; deps=tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']; subprocess.check_call([sys.executable,'-m','pip','install',*deps])"
      - name: Import app.main (mirrors Vercel cold start)
        run: |
          python -c "import app.main; print('app.main imports OK with pyproject deps only')"

  hygiene:
    name: Repo hygiene (no scratch artifacts)
    runs-on: ubuntu-latest
    # dev is the AI/testing sandbox and promotes to prod (real alumni data), so
    # throwaway test/scratch files must never be committed. Fails if any tracked
    # file looks like a scratch artifact. Legit tests live in lowercase tests/,
    # which these uppercase patterns do not match.
    steps:
      - uses: actions/checkout@v4
      - name: Block scratch / throwaway test files
        run: |
          bad=$(git ls-files | grep -E '(^|/)(TEST_[^/]*|SCRATCH[^/]*|DRAFT_[^/]*|[^/]*\.scratch|\.board-seed[^/]*|[^/]*DO_NOT_MERGE[^/]*)$' || true)
          if [ -n "$bad" ]; then
            echo "::error::Scratch/throwaway files must not be committed — dev promotes to prod:"
            echo "$bad"
            exit 1
          fi
          echo "OK: no scratch/test artifacts tracked"

  csv-schema-sync:
    name: CSV/schema sync
    runs-on: ubuntu-latest
    # Guards against a CSV import template / parser / export column drifting from
    # database/schema.sql. A silent drift makes imports reject rows or write to
    # the wrong field in production, so this fails the build with the mismatched
    # column/file named. Covers alumni, events, and donations CSVs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Assert CSV headers map to real DB columns
        run: python -m scripts.check_csv_schema_sync

  # ---------------------------------------------------------------------------
  # PROD-ONLY TIER — extra hardening required only when promoting to prod.
  # Runs on PRs targeting prod and on direct pushes to prod. Do NOT mark this
  # check "required" on the dev branch — it is skipped there and a skipped
  # required check would block dev merges forever.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (prod only)
    if: github.base_ref == 'prod' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # MIGRATION — applies pending database/migrations/*.sql to the Supabase DB that
  # matches the branch pushed: a push to `dev` migrates the DEV database, a push
  # to `prod` migrates the PROD database. Each job reads MIGRATIONS_DATABASE_URL
  # from its matching GitHub Environment (dev / production), so the same secret
  # name resolves to the correct database. Skipped on pull_request events.
  #
  # Set MIGRATIONS_DATABASE_URL on BOTH Environments (repo Settings →
  # Environments) to that DB's session-pooler (:5432) connection string.
  # ---------------------------------------------------------------------------
  migrate-dev:
    name: Migrate database (dev)
    if: github.event_name == 'push' && github.ref_name == 'dev'
    needs: [lint, test, secret-scan]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply pending migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: bash database/migrate.sh

  migrate:
    name: Migrate database
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: [lint, test, secret-scan, audit]
    runs-on: ubuntu-latest
    # The Environment exists ONLY to scope MIGRATIONS_DATABASE_URL to the prod
    # database. ⚠️ Do NOT enable required reviewers / deployment protection on
    # it — that gate caused a prod outage and was removed deliberately.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply pending migrations
        env:
          # Session-pooler (:5432) connection — set as a secret on the
          # `production` Environment in repo Settings → Environments.
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: bash database/migrate.sh
