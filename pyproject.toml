[project]
name = "fa-web-api"
version = "0.1.0"
description = "Backend API and database layer for the BYU Finance Alumni Database"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyjwt[crypto]>=2.8",
    "python-multipart>=0.0.9",  # FastAPI form/file parsing (CSV upload routes)
    "httpx>=0.27",              # Supabase Auth Admin API calls (super_admin reset)
    # Headshot normalisation (services/images.py). We re-encode every uploaded
    # photo rather than sniffing its first few bytes, which is the only thing
    # that actually removes an appended payload and the EXIF/GPS a phone writes.
    # ⚠️ Imported at MODULE level on purpose so the "Deploy deps" CI job below
    # exercises it — a lazy import inside a handler would pass CI and 500 on the
    # first upload in production.
    "pillow>=11.0",
]
# IMPORTANT: Vercel's Python builder installs from THIS list (not requirements.txt),
# so every package the app imports at load time must be here or the deployed
# function fails with "could not import app/main". The CI "Deploy deps" job installs
# only these deps and imports app.main to catch any drift before it ships.

# Tell Vercel which ASGI app to serve (avoids entrypoint ambiguity).
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Seed/fixture data is most readable as one record per line.
"scripts/seed_mock_data.py" = ["E501"]
