# Weekly deep security audit (fa-web-api).
#
# WHY THIS EXISTS SEPARATELY FROM ci.yml. CI runs on every push and has to stay
# fast, so it carries only the checks worth blocking a merge on. This one is
# allowed to be slow and thorough: it runs the heavy analysers, audits the FULL
# dependency tree rather than just what ships, scans the whole git HISTORY for
# secrets, and re-asserts the project's own security invariants. It reports
# rather than blocks — a weekly red X is a weekly notification people learn to
# ignore, and this is meant to be read.
#
# ⚠️ A SCHEDULED WORKFLOW ONLY RUNS FROM THE DEFAULT BRANCH. This repo's default
# branch is `prod`, so this file does nothing on `dev` until it is merged to
# prod. Use the "Run workflow" button (workflow_dispatch) to test it anywhere.
#
# ⚠️ SLACK NEEDS A REPO SECRET: SLACK_SECURITY_WEBHOOK_URL. There is no GitHub
# secret today (the webhook lives on the Vercel project, which Actions cannot
# read), so until one is added the audit still runs and still uploads its report
# — it just says so in the log instead of posting. It never fails for want of a
# webhook.
name: Weekly security audit

on:
  schedule:
    # Monday 04:00 UTC = Sunday 22:00 in Utah on daylight time, 21:00 on
    # standard time. Sunday night either way, which is the ask; the audit is
    # sitting there on Monday morning.
    - cron: "0 4 * * 1"
  workflow_dispatch:

# Least privilege: read the code, write CodeQL results to the Security tab.
permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          # security-extended adds the lower-confidence security queries. This
          # is the weekly job, not the merge gate, so the extra noise is
          # affordable and the extra coverage is the point.
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  audit:
    name: Deep scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary: ${{ steps.report.outputs.summary }}
      verdict: ${{ steps.report.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning needs the history, not just the tip. A key committed
          # and then "removed" in a later commit is still in the clone.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + analysers
        run: |
          python -m pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -r requirements.txt
          pip install pip-audit semgrep

      # --- 1. Our own invariants ------------------------------------------
      # The most valuable check here, because it is the only one that knows what
      # this app is: which routes may be reached without a session, that every
      # cron route verifies CRON_SECRET, and that no SQL is built by string
      # interpolation. See scripts/security_scan.py.
      - name: Project security tripwires
        id: tripwires
        continue-on-error: true
        run: python -m scripts.security_scan --json tripwires.json

      # --- 2. Dependencies, ALL of them ------------------------------------
      # ci.yml audits prod dependencies only, deliberately — a dev-only advisory
      # should not block a merge. Weekly, we want to see them anyway.
      - name: Dependency audit (full tree)
        id: deps
        continue-on-error: true
        run: pip-audit --format json --output pip-audit.json --progress-spinner off

      # --- 3. SAST ---------------------------------------------------------
      - name: Semgrep
        id: semgrep
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/python \
            --json --output semgrep.json --quiet --no-git-ignore --metrics=off

      # --- 4. Secrets, across the whole history ----------------------------
      - name: Secret scan (full history)
        id: secrets
        continue-on-error: true
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --report-format json --report-path gitleaks.json

      # --- 5. One report ----------------------------------------------------
      - name: Build report
        id: report
        if: always()
        run: python scripts/security_report.py --repo "$GITHUB_REPOSITORY" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-${{ github.run_id }}
          path: |
            security-report.md
            tripwires.json
            pip-audit.json
            semgrep.json
            gitleaks.json
          retention-days: 90
          if-no-files-found: warn

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs: [audit, codeql]
    # Report whatever happened, including when a scanner job fell over — a
    # silent week must never be indistinguishable from a clean one.
    if: always()
    steps:
      - name: Post the summary
        env:
          WEBHOOK: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          SUMMARY: ${{ needs.audit.outputs.summary }}
          VERDICT: ${{ needs.audit.outputs.verdict }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=Slack not configured::Set the SLACK_SECURITY_WEBHOOK_URL repo secret to get this weekly summary in Slack. The full report is attached to this run as an artifact."
            exit 0
          fi
          # One glanceable line, the way the app's own security alerts are
          # written — the detail lives in the artifact, not in the channel.
          if [ "$AUDIT_RESULT" != "success" ]; then
            LINE=":warning: fa-web-api weekly security audit did not finish (scan job: $AUDIT_RESULT). Nothing was checked — open the run."
          else
            LINE="${VERDICT:-:white_check_mark:} fa-web-api weekly security audit: ${SUMMARY:-all clear, nothing needs you}. CodeQL: $CODEQL_RESULT."
          fi
          jq -n --arg t "$LINE" --arg u "$RUN_URL" \
            '{text: ($t + " <" + $u + "|Full report>")}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
