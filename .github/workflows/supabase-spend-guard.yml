# Daily check that the PROD Supabase org cannot bill more than the $25 plan fee.
#
# WHY THIS EXISTS. The prod org (project njobhhdopwdodvzosrns) went Pro on
# 2026-09-15 at an agreed $25/month: $25 plan + ~$10 Micro compute - $10 compute
# credits. Supabase's Spend Cap (org billing page -> Cost Control) blocks
# usage overages, but it does NOT cover the opt-in add-ons — a bigger compute
# instance, PITR, a custom domain, IPv4, log drains, MFA phone, read replicas,
# branching compute, extra disk IOPS/throughput. Any of those is one click in
# the dashboard and shows up as money on the next invoice. This job reads the
# org's configuration through the Management API every day and goes red if
# anything is switched on that would push the bill past $25. See
# docs/SUPABASE-SPEND-GUARD.md for what it can and cannot enforce.
#
# ⚠️ IT DETECTS, IT DOES NOT PREVENT. Add-ons are pro-rated hourly, so a red run
# means at most ~24h of an accidental purchase (cents), not a full month. The
# only thing that actually BLOCKS a charge is the Spend Cap toggle, which the
# Management API does not expose and this job cannot check or flip. Keep it ON.
#
# ⚠️ A SCHEDULED WORKFLOW ONLY RUNS FROM THE DEFAULT BRANCH, which here is
# `prod`. This file does nothing on `dev` — it must be merged to `prod` before
# the schedule ever fires. Until then, use the Run workflow button.
#
# SECRETS. `SUPABASE_ACCESS_TOKEN` is a Management API personal access token
# (Account -> Access Tokens). It is read-only in what this job DOES with it,
# but the token itself is a full account token, so: name it for this workflow,
# put it nowhere else, and revoke it if this workflow is ever deleted. The
# script never prints it and redacts every error before printing.
#
# WHO GETS TOLD. A failed scheduled run emails whoever last touched the
# workflow (GitHub's default for scheduled workflows) and, if the
# SLACK_SECURITY_WEBHOOK_URL secret is set (it is — the weekly security audit
# uses it), a one-line message goes to that channel. A green run is silent.
#
# NOT A VERCEL CRON. Same reason as supabase-keepalive.yml: a Vercel cron only
# runs on production deployments and every change to one burns builds.
name: Supabase spend guard

on:
  schedule:
    # Daily at 13:30 UTC (~07:30 in Utah), so a red run is waiting at the
    # start of the day. Clear of supabase-keepalive.yml (09:00 UTC),
    # fa-web-app's keepalive (21:00 UTC) and the security audit (Mon 04:00 UTC).
    # Off the hour because GitHub drops on-the-hour schedules first under load.
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-spend-guard-${{ github.ref }}
  cancel-in-progress: false

env:
  # Repository variables (Settings -> Secrets and variables -> Actions ->
  # Variables). The ref falls back to prod's known value so the job cannot be
  # pointed at nothing; the org is optional — the script reads the project's
  # own organization_slug and, when SUPABASE_PROD_ORG is set, asserts they match.
  SUPABASE_PROD_REF: ${{ vars.SUPABASE_PROD_REF || 'njobhhdopwdodvzosrns' }}
  SUPABASE_PROD_ORG: ${{ vars.SUPABASE_PROD_ORG }}

jobs:
  guard:
    name: Check prod org against the $25 ceiling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install`: the script is stdlib-only on purpose, so a dependency
      # outage cannot silently turn this into a job that never runs.
      - name: Show the requests this run will make (no token, no network)
        run: python -m scripts.supabase_spend_guard --dry-run

      - name: Run the spend guard
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # ⚠️ `set +e`: the default shell is `bash -e` and would abort before
          # the ::error line that says WHAT is over budget. The exit code is
          # re-raised by hand at the end.
          set -u
          set +e
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error title=Spend guard not configured::The SUPABASE_ACCESS_TOKEN repository secret is missing. Nothing was checked - the prod bill is unguarded. See docs/SUPABASE-SPEND-GUARD.md."
            exit 1
          fi
          python -m scripts.supabase_spend_guard | tee guard.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(tail -n 1 guard.txt)
            echo "::error title=Supabase spend guard FAILED::${summary}. Something in the prod Supabase org will bill above the \$25 plan fee. Open the run for the line-by-line arithmetic, then revert it in the dashboard."
          elif grep -q '^WARN ' guard.txt; then
            echo "::warning title=Supabase spend guard passed with a warning::$(grep '^WARN ' guard.txt | head -n 1)"
          fi
          exit "$code"

      - name: Tell Slack (failure only)
        if: failure()
        env:
          WEBHOOK: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning title=Slack not configured::Set the SLACK_SECURITY_WEBHOOK_URL repo secret to hear about this in Slack. GitHub's failed-workflow email is the only notification for this run."
            exit 0
          fi
          summary=$(tail -n 1 guard.txt 2>/dev/null || echo "the guard did not produce a result")
          # jq assembles the JSON so the summary text cannot break the payload.
          jq -n --arg s "$summary" --arg u "$RUN_URL" \
            '{text: ("NEEDS A LOOK - Supabase spend guard: " + $s + "\nSomething in the prod Supabase org is configured to bill above the $25 plan. It is pro-rated hourly, so revert it today.\n<" + $u + "|Open the run>")}' \
            | curl -sS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
