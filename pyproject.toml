[project]
name = "fa-web-api"
version = "0.1.0"
description = "Backend API and database layer for the BYU Finance Alumni Database"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
