name: CI

# Gates code entering the long-lived branches. Mirrors fa-web-app/ci.yml:
#   - PR into dev:  BASE checks must pass (lint, import smoke, tests)
#   - PR into prod: BASE checks PLUS the prod-only tier (dependency audit)
#
# "Will it break on Vercel?" is verified by Vercel's own GitHub deployment
# check (each branch deploys to its own Vercel project), which is required
# separately via branch protection — not duplicated here.
#
# There is a SINGLE Supabase database (shared by the dev and prod deployments),
# so migrations are applied exactly once, manually gated: after checks pass on a
# push to prod, the `migrate` job applies pending SQL migrations — but only after
# a human approves it via the `production` GitHub Environment's required
# reviewers. The connection string is the Environment secret
# MIGRATIONS_DATABASE_URL (see database/migrations/README.md).
on:
  push:
    branches: [prod, dev]
  pull_request:
    branches: [prod, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12" # matches Vercel's default runtime

jobs:
  # ---------------------------------------------------------------------------
  # BASE TIER — required for BOTH dev and prod.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Import smoke check (build-equivalent)
        # No bundler for a Python serverless app; verify the ASGI app imports
        # cleanly, which is what Vercel does at cold start.
        run: python -c "import app.main; print('app.main imported OK')"
      - name: Run tests
        run: pytest -q

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks scans every commit, not just the tip
      - name: Install gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf gitleaks.tar.gz -C "$HOME/bin" gitleaks
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Scan for committed secrets
        run: gitleaks detect --redact --no-banner --verbose

  # ---------------------------------------------------------------------------
  # PROD-ONLY TIER — extra hardening required only when promoting to prod.
  # Runs on PRs targeting prod and on direct pushes to prod. Do NOT mark this
  # check "required" on the dev branch — it is skipped there and a skipped
  # required check would block dev merges forever.
  # ---------------------------------------------------------------------------
  audit:
    name: Dependency audit (prod only)
    if: github.base_ref == 'prod' || github.ref_name == 'prod'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------------------
  # MIGRATION — applies pending database/migrations/*.sql to the single shared
  # Supabase database. Runs only on a push to prod (i.e. after a prod promotion
  # merges) once the gating checks pass, and is held for manual approval by the
  # `production` Environment's required reviewers. Skipped on pull_request events
  # and on dev pushes, so a dev merge never silently alters the shared database.
  # ---------------------------------------------------------------------------
  migrate:
    name: Migrate database
    if: github.event_name == 'push' && github.ref_name == 'prod'
    needs: [lint, test, secret-scan, audit]
    runs-on: ubuntu-latest
    environment: production # required reviewers here = manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apply pending migrations
        env:
          # Direct (non-pooled, port 5432) Supabase connection — set as a secret
          # on the `production` Environment in repo Settings → Environments.
          DATABASE_URL: ${{ secrets.MIGRATIONS_DATABASE_URL }}
        run: bash database/migrate.sh
